---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Limit to the whole play to just Windows.
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts.os_family == 'Windows'
  tags:
    - main
    - schannel
    - security
    - windows
